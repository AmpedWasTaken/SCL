name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -run '^
      - run: go build ./cmd/scl
      - run: go run ./cmd/scl validate examples/appearance.conf
 -bench BenchmarkParse -benchmem
      - if: runner.os == 'Linux'
        run: go test -run '^
      - run: go build ./cmd/scl
      - run: go run ./cmd/scl validate examples/appearance.conf
 -fuzz '^FuzzParse
      - run: go build ./cmd/scl
      - run: go run ./cmd/scl validate examples/appearance.conf
 -fuzztime 5s
      - run: go build ./cmd/scl
      - run: go run ./cmd/scl validate examples/appearance.conf
