# SCL supports named blocks, readable arrays and reusable presets.

preset animated {
  enabled = true
  fps     = 30
  duration = "2s"
}

theme midnight {
  background = "#080808"
  foreground = "#FFFFFF"

  animation {
    use = "animated"
  }

  colors = [
    "#44DBD6", # Cyan
    "#B769FF", # Purple
  ]
}

theme minimal {
  background = "#000000"
  animation {
    use     = "animated"
    enabled = false
  }
}
